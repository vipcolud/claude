spring:
  application:
    name: fund-analysis-system

  datasource:
    url: jdbc:h2:mem:funddb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

logging:
  level:
    com.fundanalysis: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
